# Pool Monitor Configuration

# Pentair Home app credentials
# Can also be set via environment variables: PENTAIR_EMAIL / PENTAIR_PASSWORD
pentair:
  email: ""        # your Pentair Home app login email
  password: ""     # your Pentair Home app password (or use env var)

pump:
  poll_interval_seconds: 300          # routine checks every 5 minutes; brief fast confirmations remain

# Backup only: Pentair hydraulic source measurements currently update hourly.
# This cannot detect starvation between source updates. Keep onboard protection enabled.
flow_safety:
  enabled: true
  minimum_flow_gph: 600              # conservative severe-flow floor (10 GPM), not a diagnosis
  max_sample_age_seconds: 600        # reject missing/invalid/older source flow or power

telemetry_health:
  stale_retry_delays_seconds: []      # routine polling already retries unchanged cloud data
  stale_alert_after_seconds: 5400              # 90 minutes without a new Pentair source sample

# Shared dashboard and phone alert thresholds for independent return-flow readings.
# Starting thresholds relative to the same-program 90th-percentile flow reference.
dashboard_return_flow:
  watch_loss_pct: 15
  clean_loss_pct: 25
  inspect_loss_pct: 40
  consecutive_readings_required: 2
  reminder_hours: 12

thresholds:
  startup_grace_seconds: 120          # suppress alerts for 2 min after pump starts
  consecutive_readings_required: 3    # require N readings in a row before alerting

  # Direct pressure alerts remain disabled until s17 is calibrated to the analog gauge.

  low_speed:
    # Low speed program runs at 70.5% motor speed.
    alert_psi: 12
    emergency_psi: 18
    baseline_flow_gph: null        # awaiting a manually confirmed, attributable clean reading
    flow_alert_drop_pct: null       # disabled pending clean-flow calibration
    baseline_watts_per_gph: null    # legacy ratio calibration is not trusted
    alert_ratio_pct: 100              # WARN if ratio >100% above clean baseline
    emergency_ratio_pct: 300          # CRITICAL if ratio >300% above clean baseline

  high_speed:
    # High speed program uses its own clean-flow reference.
    alert_psi: 20
    emergency_psi: 30
    baseline_flow_gph: null        # awaiting a manually confirmed, attributable clean reading
    flow_alert_drop_pct: null       # disabled pending clean-flow calibration
    baseline_watts_per_gph: null    # legacy ratio calibration is not trusted
    alert_ratio_pct: 100              # WARN if ratio >100% above clean baseline
    emergency_ratio_pct: 300

  alert_cooldown_minutes: 30          # don't repeat same alert level within this window

ntfy:
  server: "https://ntfy.sh"
  topic: "pool_monitor_project"    # overridden by NTFY_TOPIC env var (set in .env)
  priority_alert: "high"             # iOS notification (loud)
  priority_emergency: "urgent"       # iOS critical alert (bypasses silent mode)

emergency_shutoff:
  enabled: false                     # re-enable only after a raw Pentair field capture confirms pressure mapping
  pressure_mapping_verified: false   # also gates direct PSI alerts until gauge calibration
  consecutive_required: 1            # 1 confirmed CRITICAL output = shutoff (window itself requires 3 readings)
  delay_seconds: 30

logging:
  level: "INFO"
  file: "logs/pool_monitor.log"
